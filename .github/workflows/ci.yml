name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    env:
      # Credentials for the Azure Artifacts Credential Provider so that `dotnet restore`
      # can authenticate to the private Azure DevOps feed (PS-GCM-FieldExperiencePlatform)
      # referenced by src/service/NuGet.Config.
      # Requires a repository/organization secret named AZURE_DEVOPS_TOKEN holding an
      # Azure DevOps PAT (MicrosoftIT org) with the "Packaging (Read)" scope.
      VSS_NUGET_EXTERNAL_FEED_ENDPOINTS: '{"endpointCredentials":[{"endpoint":"https://pkgs.dev.azure.com/MicrosoftIT/OneITVSO/_packaging/PS-GCM-FieldExperiencePlatform/nuget/v3/index.json","username":"AzureDevOps","password":"${{ secrets.AZURE_DEVOPS_TOKEN }}"}]}'

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET 10.x
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Install Azure Artifacts Credential Provider
      run: sh -c "$(curl -fsSL https://aka.ms/install-artifacts-credprovider.sh)"

    - name: Verify Azure DevOps feed credential is available
      env:
        ADO_PAT: ${{ secrets.AZURE_DEVOPS_TOKEN }}
      run: |
        if [ -z "$ADO_PAT" ]; then
          echo "::error::Secret AZURE_DEVOPS_TOKEN is empty or not set for this run. Add it under Settings > Secrets and variables > Actions."
          exit 1
        fi
        echo "AZURE_DEVOPS_TOKEN is present (length ${#ADO_PAT})."
    
    - name: Restore dependencies
      run: dotnet restore  src/service/Microsoft.FeatureFlighting.sln
    
    - name: Build
      run: dotnet build src/service/Microsoft.FeatureFlighting.sln --no-restore
    
    - name: Test
      run: dotnet test src/service/Microsoft.FeatureFlighting.sln --no-build --verbosity normal /p:CollectCoverage=true /p:CoverletOutput=TestResults/ /p:CoverletOutputFormat=lcov

    - name: Restore dependencies (Functional Tests)
      run: dotnet restore tests/functional/Microsoft.FeatureFlighting.Tests.Functional.sln
    
    - name: Build (Functional Tests)
      run: dotnet build tests/functional/Microsoft.FeatureFlighting.Tests.Functional.sln --no-restore
